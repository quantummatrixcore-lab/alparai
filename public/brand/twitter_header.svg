  <!-- Badges -->
  <g transform="translate(385, 340)">
    <rect x="0" y="0" width="220" height="44" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.6" />
    <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="800" fill="#c084fc">🛡️ 2,880+ INCIDENTS</text>

    <rect x="240" y="0" width="250" height="44" rx="10" fill="#0c4a6e" stroke="#0284c7" stroke-opacity="0.6" />
    <text x="260" y="28" font-family="sans-serif" font-size="15" font-weight="800" fill="#38bdf8">⚖️ EU AI ACT COMPLIANT</text>
  </g>

