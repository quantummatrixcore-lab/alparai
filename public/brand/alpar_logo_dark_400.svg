<!-- ALPAR AI Master Avatar / Profile Logo (400x400) - Ultra Premium Dark Theme -->
<svg viewBox="0 0 400 400" width="400" height="400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <radialGradient id="avatar-bg" cx="50%" cy="50%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="avatar-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shield Left Wing Gradient -->
    <linearGradient id="shield-left-wing" x1="15" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Shield Right Wing Gradient -->
    <linearGradient id="shield-right-wing" x1="85" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Inner Neon Apex Beam -->
    <linearGradient id="apex-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="400" height="400" rx="40" fill="url(#avatar-bg)" />
  <rect x="1" y="1" width="398" height="398" rx="39" fill="none" stroke="url(#avatar-border)" stroke-width="2" />

  <!-- Ambient Central Neon Aura -->
  <circle cx="200" cy="200" r="110" fill="#6366f1" fill-opacity="0.15" filter="url(#shield-glow)" />

  <!-- Master Cyber Sentinel Monogram Shield (Centered, 280x280 scale) -->
  <g transform="translate(60, 45) scale(2.8)" filter="url(#shield-glow)">
    <!-- Left Facet -->
    <path d="M 50,8 L 16,24 V 52 C 16,73 34,88 50,94 V 58 L 32,58 L 50,22 Z" fill="url(#shield-left-wing)" />
    <!-- Right Facet -->
    <path d="M 50,8 L 84,24 V 52 C 84,73 66,88 50,94 V 58 L 68,58 L 50,22 Z" fill="url(#shield-right-wing)" />
    <!-- Inner Monogram 'A' Apex -->
    <path d="M 50,22 L 64,52 H 36 L 50,22 Z" fill="url(#apex-beam)" />
    <!-- Dark Inner Triangle Cutout -->
    <path d="M 50,33 L 57,48 H 43 L 50,33 Z" fill="#070b14" />
    <!-- Crossbar Beam -->
    <rect x="28" y="55" width="44" height="4.5" rx="2.25" fill="#ffffff" />
    <!-- Starburst Core Spark -->
    <path d="M 50,44 L 51.8,48.2 L 56,50 L 51.8,51.8 L 50,56 L 48.2,51.8 L 44,50 L 48.2,48.2 Z" fill="#ffffff" />
  </g>
</svg>
