name: Generate VC Data Room PDF

on:
  push:
    paths:
      - "docs/DATA_ROOM/**"
      - "scripts/generate-data-room.sh"
    branches:
      - master
  workflow_dispatch:

jobs:
  generate_pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Make script executable
        run: chmod +x scripts/generate-data-room.sh

      - name: Generate PDF
        run: ./scripts/generate-data-room.sh

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALPAR_AI_Data_Room
          path: docs/DATA_ROOM/build/ALPAR_AI_Data_Room.pdf
          retention-days: 90
