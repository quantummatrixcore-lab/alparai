name: Jules Autonomous Trigger Workflow

on:
  push:
    paths:
      - "src/lib/dummy-jules-bait.ts"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for Jules Agent"
        required: false
        default: "Inspect src/lib/dummy-jules-bait.ts for doc, typo, or type improvements and create a Pull Request."

jobs:
  trigger-jules:
    name: Trigger Jules Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run Jules Trigger Script
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_REPO: ${{ github.repository }}
          JULES_BRANCH: ${{ github.ref_name }}
        run: node scripts/trigger-jules.mjs
