# ALPAR AI tmux Configuration
# ~/.tmux.conf  (veya: tmux.exe -f D:\Alparai\ops\.tmux.conf source-file D:\Alparai\ops\.tmux.conf)

# ── Prefix: Ctrl+A (screen-style, daha ergonomik) ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Mouse desteği ──
set -g mouse on

# ── Renk ve terminal ──
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── Status bar ──
set -g status-interval 5
set -g status-position top
set -g status-style "bg=#1a1a2e fg=#a0a0c0"
set -g status-left "#[bg=#16213e fg=#e94560 bold] ALPAR AI #[bg=#1a1a2e fg=#a0a0c0] "
set -g status-left-length 20
set -g status-right "#[fg=#4ade80] #{session_name} #[fg=#a0a0c0]| #[fg=#60a5fa]%H:%M "
set -g status-right-length 30

# Aktif window vurgusu
set -g window-status-current-style "bg=#0f3460 fg=#e94560 bold"
set -g window-status-style "fg=#606080"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# ── Pane border ──
set -g pane-border-style "fg=#2a2a4a"
set -g pane-active-border-style "fg=#e94560"

# ── Kısayollar ──
# Pane split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Yön tuşlarıyla pane gezintisi (Ctrl+A + ok)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Window gezintisi (Alt+1/2/3)
bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2

# Reload config
bind r source-file "D:\Alparai\ops\.tmux.conf" \; display "Config yenilendi!"

# ── Scrollback ──
set -g history-limit 10000

# ── Renk düzeltme ──
set -sg escape-time 0
