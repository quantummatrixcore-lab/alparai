<svg viewBox="0 0 1128 191" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cyber Space Background -->
    <linearGradient id="v3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712" />
      <stop offset="40%" stop-color="#090e21" />
      <stop offset="80%" stop-color="#0c132c" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>

    <!-- Neon Apex Beam -->
    <linearGradient id="v3-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Shield Hologram Gradients -->
    <linearGradient id="v3-shield-l" x1="15" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="v3-shield-r" x1="85" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="v3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1128" height="191" fill="url(#v3-bg)" />

  <!-- Subtle Perspective Grid (High-Tech Grid) -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="48" x2="1128" y2="48" />
    <line x1="0" y1="96" x2="1128" y2="96" />
    <line x1="0" y1="144" x2="1128" y2="144" />
    <line x1="280" y1="0" x2="280" y2="191" />
    <line x1="500" y1="0" x2="500" y2="191" />
    <line x1="720" y1="0" x2="720" y2="191" />
    <line x1="940" y1="0" x2="940" y2="191" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="560" cy="80" r="170" fill="#a855f7" fill-opacity="0.10" filter="url(#v3-glow)" />
  <circle cx="980" cy="95" r="140" fill="#38bdf8" fill-opacity="0.10" filter="url(#v3-glow)" />

  <!-- LEFT ZONE (x: 0 to 280) IS COMPLETELY CLEAR FOR THE LINKEDIN PROFILE PICTURE OVERLAY -->

  <!-- CENTER-LEFT CONTENT (Starts at x=290 to prevent ANY collision with Avatar) -->
  <g transform="translate(290, 0)">
    <!-- Brand Name -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5px">
      <tspan fill="#ffffff">ALPAR </tspan>
      <tspan fill="url(#v3-neon)">AI</tspan>
    </text>

    <!-- Tagline (Timeless, Authoritative) -->
    <text x="2" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#94a3b8" letter-spacing="1.8px">
      THE SOVEREIGN TRUST &amp; ACCOUNTABILITY INFRASTRUCTURE FOR GLOBAL AI
    </text>

    <!-- Timeless Enterprise Badges (NO static numbers, 100% dynamic architecture) -->
    <g transform="translate(2, 124)">
      <!-- Badge 1: Real-Time Incident Radar -->
      <rect x="0" y="0" width="200" height="30" rx="8" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="14" y="20" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#c084fc">🛡️ REAL-TIME INCIDENT RADAR</text>

      <!-- Badge 2: EU AI Act Compliance -->
      <rect x="212" y="0" width="205" height="30" rx="8" fill="#082f49" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="226" y="20" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#38bdf8">⚖️ EU AI ACT COMPLIANCE</text>

      <!-- Badge 3: Sovereign Trust Standard -->
      <rect x="429" y="0" width="180" height="30" rx="8" fill="#141c38" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="442" y="20" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#e2e8f0">🌐 SOVEREIGN TRUST BADGES</text>
    </g>
  </g>

  <!-- FAR RIGHT: Holographic Cyber Sentinel Shield -->
  <g transform="translate(980, 28) scale(1.42)" filter="url(#v3-glow)">
    <path d="M 50,8 L 16,24 V 52 C 16,73 34,88 50,94 V 58 L 32,58 L 50,22 Z" fill="url(#v3-shield-l)" opacity="0.9" />
    <path d="M 50,8 L 84,24 V 52 C 84,73 66,88 50,94 V 58 L 68,58 L 50,22 Z" fill="url(#v3-shield-r)" opacity="0.9" />
    <path d="M 50,22 L 64,52 H 36 L 50,22 Z" fill="url(#v3-neon)" />
    <path d="M 50,33 L 57,48 H 43 L 50,33 Z" fill="#090e21" />
    <rect x="28" y="55" width="44" height="4.5" rx="2.25" fill="#ffffff" />
    <path d="M 50,44 L 51.8,48.2 L 56,50 L 51.8,51.8 L 50,56 L 48.2,51.8 L 44,50 L 48.2,48.2 Z" fill="#ffffff" />
  </g>

  <!-- URL Bottom Right -->
  <text x="1100" y="174" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5px">
    WWW.ALPARAI.COM
  </text>
</svg>
