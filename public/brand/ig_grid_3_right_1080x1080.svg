<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>

    <!-- Emerald Trust Glow -->
    <radialGradient id="trustGlow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Electric Glow (Left connection) -->
    <radialGradient id="cyanLeftGlow" cx="0%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="45" cy="45" r="1.2" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Tech Matrix Pattern -->
    <pattern id="techMatrix" width="18" height="18" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- 1. BASE CANVASES -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  <rect width="1080" height="1080" fill="url(#trustGlow)"/>
  <rect width="1080" height="1080" fill="url(#cyanLeftGlow)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect x="700" y="0" width="380" height="1080" fill="url(#techMatrix)"/>

  <!-- CONTINUOUS PANORAMIC LASER LINES (MATCHES LEFT & CENTER PANELS) -->
  <line x1="0" y1="90" x2="1080" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="0" y1="990" x2="1080" y2="990" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="0" y1="540" x2="1080" y2="540" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 8" stroke-opacity="0.22"/>

  <!-- TOP STATUS BAR -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#0c1f18" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="28" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5">STATUS: ENFORCED</text>
  </g>
  <g transform="translate(860, 64)">
    <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PANEL 3 / 3</text>
  </g>

  <!-- CONTENT BODY -->
  <g transform="translate(80, 160)">
    <!-- Section Identifier -->
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3">03 // THE ENFORCEMENT</text>

    <!-- Main Headline -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      VERIFIABLE TRUST.
    </text>
    <text x="0" y="125" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      AT MACHINE SPEED.
    </text>

    <!-- Explanatory Subtext -->
    <text x="0" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      Alpar AI delivers institutional-grade continuous auditing,
    </text>
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      giving enterprises cryptographic proof of algorithmic integrity.
    </text>

    <!-- Capability Card 1: 660+ Models -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="460" height="82" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="34" cy="41" r="15" fill="#0284c7" fill-opacity="0.2"/>
      <text x="34" y="47" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">⚡</text>
      <text x="64" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">660+ MODELS LIVE SENTINEL</text>
      <text x="64" y="56" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Autonomous benchmarks, jailbreak tests &amp; bias vectors.</text>
    </g>

    <!-- Capability Card 2: 72h SLA -->
    <g transform="translate(0, 355)">
      <rect x="0" y="0" width="460" height="82" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="34" cy="41" r="15" fill="#10b981" fill-opacity="0.2"/>
      <text x="34" y="47" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle">✓</text>
      <text x="64" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">EU AI ACT 72-HOUR RAPID SLA</text>
      <text x="64" y="56" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Fast-track regulatory compliance certification.</text>
    </g>

    <!-- Capability Card 3: Cryptographic Certificate -->
    <g transform="translate(0, 455)">
      <rect x="0" y="0" width="460" height="82" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="34" cy="41" r="15" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="34" y="47" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle">🛡️</text>
      <text x="64" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">CRYPTOGRAPHIC TRUST CERTIFICATES</text>
      <text x="64" y="56" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Tamper-proof verifiable badge for enterprise trust.</text>
    </g>

    <!-- Master Action CTA Button -->
    <g transform="translate(0, 570)">
      <rect x="0" y="0" width="460" height="64" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="230" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">
        SCAN YOUR MODEL NOW →
      </text>
    </g>

    <!-- Link in Bio Callout -->
    <g transform="translate(0, 665)">
      <text x="230" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.5">
        👉 Tap the <tspan fill="#38bdf8">Link in Bio</tspan> or visit <tspan fill="#ffffff">alparai.com</tspan>
      </text>
    </g>
  </g>

  <!-- BOTTOM FOOTER -->
  <g transform="translate(80, 1030)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OFFICIAL OUTPOST: <tspan fill="#ffffff">@alparai</tspan> · SLIDE 3 OF 3</text>
  </g>
</svg>
