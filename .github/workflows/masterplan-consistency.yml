name: Master Plan Consistency Check

on:
  push:
    paths:
      - "docs/MASTER_PLAN.md"

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check Master Plan Consistency
        run: node scripts/check-masterplan-consistency.mjs
