<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1128px;
        height: 191px;
        background: linear-gradient(135deg, #0a1622 0%, #0d1f33 40%, #0a1622 100%);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .glow {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%);
        top: -150px;
        right: 100px;
      }
      .glow2 {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 255, 136, 0.05) 0%, transparent 70%);
        bottom: -100px;
        left: 200px;
      }
      .content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 80px;
      }
      .left {
        flex: 1;
      }
      .logo-text {
        color: #ffffff;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: 4px;
        margin-bottom: 8px;
      }
      .logo-text span {
        color: #00ff88;
      }
      .tagline {
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 1px;
      }
      .tagline strong {
        color: #00ff88;
        font-weight: 600;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      .stat {
        text-align: center;
      }
      .stat-num {
        color: #00ff88;
        font-size: 36px;
        font-weight: 800;
      }
      .stat-label {
        color: rgba(255, 255, 255, 0.5);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 2px;
      }
      .divider {
        width: 1px;
        height: 50px;
        background: rgba(0, 255, 136, 0.2);
      }
      .accent-line {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #00ff88 0%, transparent 60%);
      }
      .shield-mini {
        position: absolute;
        right: 60px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.06;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="shield-mini">
      <svg width="200" height="240" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 L95 20 L95 55 Q95 90 50 115 Q5 90 5 55 L5 20 Z" fill="#00FF88" />
      </svg>
    </div>
    <div class="content">
      <div class="left">
        <div class="logo-text">ALPAR <span>AI</span></div>
        <div class="tagline"><strong>Trust Infrastructure</strong> for AI Accountability</div>
      </div>
      <div class="right">
        <div class="stat">
          <div class="stat-num">100+</div>
          <div class="stat-label">Incidents<br />Tracked</div>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <div class="stat-num">EU</div>
          <div class="stat-label">AI Act<br />Ready</div>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <div class="stat-num">24/7</div>
          <div class="stat-label">Public<br />Registry</div>
        </div>
      </div>
    </div>
    <div class="accent-line"></div>
  </body>
</html>
