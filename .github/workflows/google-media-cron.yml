name: Wolf Pack - Google Media Automator (Cron)

on:
  schedule:
    # Runs at 00:00 UTC every Sunday (Haftada 1 Pazartesi gecesi)
    - cron: "0 0 * * 0"
  workflow_dispatch: # Manuel tetikleme için

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  run-automator:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start Google Chrome in Headless Debugging Mode
        run: |
          Start-Process "C:\Program Files\Google\Chrome\Application\chrome.exe" -ArgumentList "--headless=new", "--remote-debugging-port=9222", "--user-data-dir=$env:TEMP\chrome-profile"
          Start-Sleep -Seconds 5

      - name: Run Google Media Automator (Vids & Flow)
        run: node google_media_automator.js both "Alparai Haftalık Büyüme Raporu ve Vizyon Animasyonu"
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
