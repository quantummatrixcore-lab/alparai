name: Alparai Zero-Touch Production CI/CD

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-supabase.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-service-role-key' }}

jobs:
  # =========================================================================
  # 1. TYPECHECK (EDISON)
  # =========================================================================
  typecheck:
    name: "1. Typecheck (Edison)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck (Edison Protocol)
        run: pnpm typecheck

  # =========================================================================
  # 2. VITEST & PLAYWRIGHT TESTS (LOVELACE)
  # =========================================================================
  test:
    name: "2. Vitest & Playwright (Lovelace)"
    needs: [typecheck]
    runs-on: ubuntu-latest
    env:
      IS_PLAYWRIGHT_TEST: "true"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Install Playwright Chromium & System Deps
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js Application
        run: pnpm build

      - name: Start App for E2E Tests
        run: |
          pnpm exec next start --port 3000 &
          npx --yes wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Test Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # =========================================================================
  # 3. ESLINT QUALITY GATE (AURELIUS)
  # =========================================================================
  lint:
    name: "3. ESLint & Quality Gate"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n Translations
        run: pnpm i18n:check

      - name: Run ESLint
        run: pnpm lint

  # =========================================================================
  # 4. CLOUDFLARE PAGES NATIVE DEPLOY (SOVEREIGN)
  # =========================================================================
  # Deployment is handled natively by the Cloudflare Pages GitHub integration.
  # This pipeline ensures the code passes all tests and quality gates before Cloudflare builds it.

  # =========================================================================
  # 5. SUPABASE MIGRATION (CLI)
  # =========================================================================
  supabase_migration:
    name: "5. Supabase Migration (CLI)"
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase Migrations via CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Linking Supabase project: $SUPABASE_PROJECT_REF"
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            echo "Applying database migrations..."
            supabase db push --password "$SUPABASE_DB_PASSWORD"
            echo "✅ Supabase migration completed successfully."
          else
            echo "⚠️ Supabase credentials not found in secrets. Falling back to migration script..."
            node scripts/apply-migrations.mjs || echo "Skipping migration script fallback."
          fi
