name: Master Plan Guard

on:
  push:
    paths:
      - "docs/MASTER_PLAN.md"
  pull_request:
    paths:
      - "docs/MASTER_PLAN.md"

jobs:
  check-author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Two independent conditions must BOTH hold: an Architect marker in the
      # message, and an allowlisted author (unless ARCHITECT=1 env bypass is used).
      - name: Verify commit is an Architect commit
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%ae')
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          echo "Commit author: $AUTHOR"
          echo "Commit message: $COMMIT_MSG"

          if [ "$ARCHITECT" = "1" ]; then
            echo "✅ Architect bypass enabled via ENV."
          else
            if [[ "$COMMIT_MSG" != *"[architect]"* && "$COMMIT_MSG" != *"ARCHITECT"* ]]; then
              echo "::error::docs/MASTER_PLAN.md is Architect-owned (G-6a). This commit carries no [architect] marker. Implementer sessions must not edit the plan: write the change as a specification and let the Architect record it."
              exit 1
            fi
          fi

          ALLOWED=("noreply@anthropic.com" "claude@anthropic.com" "240367464+quantummatrixcore-lab@users.noreply.github.com" "quantum.matrix.core@gmail.com" "ercument.erden@alparai.com")
          MATCH=false
          for EMAIL in "${ALLOWED[@]}"; do
            if [[ "$AUTHOR" == "$EMAIL" ]]; then
              MATCH=true
              break
            fi
          done
          if [ "$MATCH" = false ] && [ "$ARCHITECT" != "1" ]; then
            echo "::error::MASTER_PLAN.md may only be modified by Architect sessions. Commit author: $AUTHOR"
            exit 1
          fi
          echo "✅ Architect marker present and author allowlisted."

  consistency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run consistency check
        run: node scripts/check-masterplan-consistency.mjs
      - name: Closure evidence check (G-7)
        run: node scripts/check-closure-evidence.mjs

  check-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check MASTER_PLAN.md 400-line limit (ZETA-2 / Task #209)
        run: node scripts/check-master-plan-length.mjs
