<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#03060f"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>

    <!-- Supernova Cyan Glow -->
    <radialGradient id="supernovaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Cobalt Ray Glow -->
    <radialGradient id="coreAura" cx="50%" cy="38%" r="28%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Titanium Shading -->
    <linearGradient id="facetTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Cobalt Prismatic Shading -->
    <linearGradient id="facetCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Optical Refraction Beam -->
    <linearGradient id="facetBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="45" cy="45" r="1.2" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- 1. BASE CANVASES -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  <rect width="1080" height="1080" fill="url(#supernovaGlow)"/>
  <rect width="1080" height="1080" fill="url(#coreAura)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <!-- CONTINUOUS PANORAMIC LASER LINES (CONNECTS PERFECTLY WITH LEFT & RIGHT) -->
  <line x1="0" y1="90" x2="1080" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="0" y1="990" x2="1080" y2="990" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="0" y1="540" x2="1080" y2="540" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 8" stroke-opacity="0.22"/>

  <!-- TOP HEADER BADGE -->
  <g transform="translate(540, 60)">
    <rect x="-140" y="0" width="280" height="28" rx="14" fill="#081528" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="-116" cy="14" r="5" fill="#00f0ff"/>
    <text x="-98" y="18" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">OFFICIAL CORE ACTIVATION</text>
  </g>
  <g transform="translate(80, 64)">
    <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PANEL 2 / 3</text>
  </g>

  <!-- HERO CENTER PIECE: MONOLITHIC PRISMATIC 'A' -->
  <g transform="translate(540, 390)">
    <!-- Radial Target HUD Rings -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Reticle Markings -->
    <line x1="-240" y1="0" x2="-210" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="210" y1="0" x2="240" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="-240" x2="0" y2="-210" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="210" x2="0" y2="240" stroke="#38bdf8" stroke-width="2"/>

    <!-- Grand Emblem Structure (scale ~3.2) -->
    <g transform="translate(-160, -160) scale(3.2)">
      <!-- Left Titanium Facet -->
      <polygon points="50,12 18,86 35,86 50,48" fill="url(#facetTitanium)"/>

      <!-- Right Cobalt Prismatic Facet -->
      <polygon points="50,12 50,48 65,86 82,86" fill="url(#facetCobalt)"/>

      <!-- Optical Refraction Beam -->
      <polygon points="33,69 67,69 50,44" fill="url(#facetBeam)"/>
      <polygon points="36,69 64,69 50,81" fill="#050914"/>

      <!-- Central Light Ray & Apex Sparkle -->
      <polygon points="50,12 47,48 53,48" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="50" cy="46" r="3" fill="#ffffff"/>
      <circle cx="50" cy="46" r="6" fill="#00f0ff" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- CORE TYPOGRAPHY & VALUE PROP -->
  <g transform="translate(540, 670)">
    <!-- Sub-heading Tag -->
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3" text-anchor="middle">
      02 // THE VERDICT
    </text>

    <!-- Main Grand Brand Title -->
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      ALPAR<tspan fill="#38bdf8">.AI</tspan>
    </text>

    <!-- Institutional Declaration -->
    <text x="0" y="115" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="0.5" text-anchor="middle">
      THE SUPREME COURT OF AI ACCOUNTABILITY
    </text>

    <!-- Sub-declaration -->
    <text x="0" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2" text-anchor="middle">
      Autonomous Auditing · Algorithmic Defense · Cryptographic Trust
    </text>

    <!-- Official Launch Pill -->
    <g transform="translate(-160, 190)">
      <rect x="0" y="0" width="320" height="42" rx="21" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="160" y="26" fill="#f0f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">
        WELCOME TO THE OUTPOST
      </text>
    </g>
  </g>

  <!-- BOTTOM FOOTER -->
  <g transform="translate(540, 1030)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      FOLLOW <tspan fill="#ffffff">@ALPARAI</tspan> · SLIDE 2 OF 3 · TEKNOPARK ISTANBUL
    </text>
  </g>
</svg>
