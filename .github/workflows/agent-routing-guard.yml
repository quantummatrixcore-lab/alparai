name: Agent Routing Guard

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-direct-push-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify direct push is not from PR-only agents (Jules or GitHub-Claude)
        run: |
          AUTHOR_EMAIL_LOWER=$(git log -1 --pretty=format:'%ae' | tr '[:upper:]' '[:lower:]')
          AUTHOR_NAME_LOWER=$(git log -1 --pretty=format:'%an' | tr '[:upper:]' '[:lower:]')
          COMMIT_MSG=$(git log -1 --pretty=format:'%B')
          echo "Commit author email: $AUTHOR_EMAIL_LOWER"
          echo "Commit author name: $AUTHOR_NAME_LOWER"

          if [[ "$AUTHOR_EMAIL_LOWER" =~ jules|claude ]] || [[ "$AUTHOR_NAME_LOWER" =~ jules|claude ]]; then
            echo "::error::Direct push to master blocked for PR-only agent ($AUTHOR_EMAIL_LOWER / $AUTHOR_NAME_LOWER). Task #213: Jules and GitHub-Claude must submit via Pull Request only."
            exit 1
          fi

          if echo "$COMMIT_MSG" | grep -qiE '\[jules-direct-push\]|\[claude-direct-push\]'; then
            echo "::error::Direct push tag detected for PR-only agent. Task #213 violation."
            exit 1
          fi

          echo "Identity check passed for master direct push."
