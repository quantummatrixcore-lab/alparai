name: Master Plan Consistency Check

on:
  push:
    paths:
      - "docs/MASTER_PLAN.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Master Plan Consistency
        run: node scripts/check-masterplan-consistency.mjs
