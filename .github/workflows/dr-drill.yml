name: dr-drill
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}
jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/lib/dehost/fail-loud.test.ts tests/contracts/canonical-metrics.test.ts
      - run: echo "DR-DRILL $(date -u +%FT%TZ) OK" >> docs/OPS_DR_PLAYBOOK.md
