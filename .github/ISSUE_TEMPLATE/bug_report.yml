name: "🐛 Bug Report"
description: "File an issue about a bug or broken functionality in the ALPAR AI platform."
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide detailed reproduction steps.
  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is."
      placeholder: "When navigating to /incidents, the filter dropdown fails to update..."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Browser, OS, Node.js version, etc."
      placeholder: "Chrome 128 on Windows 11 / Node.js 20.x"
