name: Automated Secret Scan

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "ops/visual-baseline/**"
      - ".vscode/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "ops/visual-baseline/**"
      - ".vscode/**"

jobs:
  gitleaks:
    name: Gitleaks Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
