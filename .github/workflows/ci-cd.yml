name: Alparai Sürü (Wolf Pack) CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "ops/visual-baseline/**"
      - ".vscode/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "ops/visual-baseline/**"
      - ".vscode/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build_and_test:
    name: Sürü Analizi ve Kod Doğrulama
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v3

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: pnpm Yükle
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Bağımlılıkları Yükle
        run: pnpm install

      - name: Tip Denetimi (Typecheck)
        run: pnpm typecheck

      - name: Linter (Sürü Disiplini)
        run: pnpm lint

      - name: Build Kontrolü (Cloudflare Hazırlığı)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Supabase Keys will be injected by GitHub Secrets

  # Cloudflare deployment is handled natively by the Cloudflare Pages App.
  # This action ensures code is clean before Cloudflare triggers deployment.
