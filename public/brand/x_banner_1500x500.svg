<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060f"/>
      <stop offset="45%" stop-color="#070c18"/>
      <stop offset="85%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Cyan Electric Radial Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Cobalt Backglow -->
    <radialGradient id="cobaltGlow" cx="50%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Violet Sub-glow -->
    <radialGradient id="violetGlow" cx="20%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Titanium Chiseled Shading -->
    <linearGradient id="facetTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Cobalt Prismatic Shading -->
    <linearGradient id="facetCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Optical Core Beam -->
    <linearGradient id="facetBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Precision Grid Pattern -->
    <pattern id="auditGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.07"/>
      <circle cx="40" cy="40" r="1.1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Diagonal Telemetry Stripes -->
    <pattern id="diagStripes" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- 1. BASE BACKGROUND & GLOW LAYERS -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>
  <rect width="1500" height="500" fill="url(#cyanGlow)"/>
  <rect width="1500" height="500" fill="url(#cobaltGlow)"/>
  <rect width="1500" height="500" fill="url(#violetGlow)"/>
  <rect width="1500" height="500" fill="url(#auditGrid)"/>
  <rect x="900" y="0" width="600" height="500" fill="url(#diagStripes)"/>

  <!-- Horizontal Axis Lines -->
  <line x1="0" y1="36" x2="1500" y2="36" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="0" y1="464" x2="1500" y2="464" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(60, 24)">
    <circle cx="6" cy="0" r="3" fill="#22c55e"/>
    <text x="18" y="4" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYS_NODE: ISTANBUL CUBE // LIVE STATUS: OPERATIONAL // EU AI ACT REGISTRY SYNC: 100%</text>
  </g>
  <g transform="translate(1320, 24)">
    <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">LATENCY: 12ms</text>
  </g>

  <!-- 2. MAIN HERO CONTENT AREA (Offset to right of avatar) -->
  <g transform="translate(360, 95)">
    <!-- Pill Badge: Institutional Trust -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#081528" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#00f0ff"/>
    <circle cx="16" cy="14" r="7.5" fill="#00f0ff" fill-opacity="0.25"/>
    <text x="32" y="18" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.8">GLOBAL AI AUDITING &amp; DEFENSE REGISTRY</text>

    <!-- Main Typography: Brand Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">
      ALPAR<tspan fill="#38bdf8">.AI</tspan>
    </text>

    <!-- Supreme Headline -->
    <text x="0" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
      THE SUPREME COURT OF AI ACCOUNTABILITY
    </text>

    <!-- Value Prop Subhead -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">
      Independent Algorithmic Auditing · Zero-Day Bias &amp; Jailbreak Sentry · EU AI Act 72h SLA
    </text>

    <!-- Metrics Badges Row -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: 660+ Models -->
      <g>
        <rect x="0" y="0" width="165" height="42" rx="8" fill="#0c1626" stroke="#223b5c" stroke-width="1.2"/>
        <text x="18" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900">660+</text>
        <text x="70" y="25" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">MODELS</text>
      </g>

      <!-- Badge 2: 2,900+ Incidents -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="195" height="42" rx="8" fill="#0c1626" stroke="#223b5c" stroke-width="1.2"/>
        <text x="18" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900">2,900+</text>
        <text x="82" y="25" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">INCIDENTS</text>
      </g>

      <!-- Badge 3: EU AI Act SLA -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="220" height="42" rx="8" fill="#0c1626" stroke="#3b82f6" stroke-width="1.2"/>
        <circle cx="18" cy="21" r="5" fill="#3b82f6"/>
        <text x="32" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">EU AI ACT · 72h SLA</text>
      </g>
    </g>

    <!-- Bottom Outpost Footer Details -->
    <g transform="translate(0, 285)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1">
        OFFICIAL DISPATCH: <tspan fill="#ffffff">@alparai</tspan> · DISCOVER AT <tspan fill="#38bdf8">ALPARAI.COM</tspan> · TEKNOPARK ISTANBUL CUBE
      </text>
    </g>
  </g>

  <!-- 4. RIGHT FLANK: GRAND MONOLITHIC PRISMATIC 'A' EMBLEM -->
  <g transform="translate(1220, 105)">
    <!-- Ambient Aura -->
    <circle cx="120" cy="140" r="160" fill="#0284c7" fill-opacity="0.18" filter="blur(30px)"/>
    <circle cx="120" cy="140" r="90" fill="#00f0ff" fill-opacity="0.12"/>

    <!-- Orbital Cyber Rings -->
    <circle cx="120" cy="140" r="155" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.25"/>
    <circle cx="120" cy="140" r="130" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Radar Sweep Marker -->
    <line x1="120" y1="140" x2="250" y2="70" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="250" cy="70" r="3" fill="#00f0ff"/>

    <!-- Target Reticle Corners -->
    <path d="M 0 10 L 0 0 L 10 0" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M 230 0 L 240 0 L 240 10" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M 0 270 L 0 280 L 10 280" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M 230 280 L 240 280 L 240 270" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Monolithic Prismatic 'A' Construction -->
    <g transform="translate(20, 15) scale(2)">
      <!-- Left Titanium Facet -->
      <polygon points="50,12 18,86 35,86 50,48" fill="url(#facetTitanium)"/>

      <!-- Right Cobalt Prismatic Facet -->
      <polygon points="50,12 50,48 65,86 82,86" fill="url(#facetCobalt)"/>

      <!-- Crossbar Optical Refraction Prism -->
      <polygon points="33,69 67,69 50,44" fill="url(#facetBeam)"/>
      <polygon points="36,69 64,69 50,81" fill="#050914"/>

      <!-- Keystone Sparkle Apex -->
      <polygon points="50,12 47,48 53,48" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="50" cy="46" r="2.8" fill="#ffffff"/>
    </g>

    <!-- Telemetry Readouts under Emblem -->
    <text x="120" y="275" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="3">ALPAR CORE v2.4 // VERIFIED</text>
  </g>
</svg>
