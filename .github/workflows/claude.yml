name: Claude Code GitHub Action

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-executor:
    if: ${{ github.event.label.name == 'claude' || (github.event.comment && contains(github.event.comment.body, '@claude')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute Claude PR Generator
        run: |
          echo "Claude Code triggered via GitHub. Constraint (Task #211 & #213): Output MUST be a Pull Request, never direct push to master."
