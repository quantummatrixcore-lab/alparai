  </defs>

  <rect width="1500" height="500" fill="url(#tw-bg)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5">
    <line x1="0" y1="100" x2="1500" y2="100" />
    <line x1="0" y1="200" x2="1500" y2="200" />
    <line x1="0" y1="300" x2="1500" y2="300" />
    <line x1="0" y1="400" x2="1500" y2="400" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
    <line x1="1200" y1="0" x2="1200" y2="500" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="350" cy="250" r="220" fill="#a855f7" fill-opacity="0.10" />
  <circle cx="1150" cy="250" r="200" fill="#38bdf8" fill-opacity="0.08" />

  <!-- Shield Icon -->
  <g transform="translate(140, 150) scale(2.0)">
    <path d="M 50,8 L 16,24 V 52 C 16,73 34,88 50,94 V 58 L 32,58 L 50,22 Z" fill="url(#tw-shield-left)" />
    <path d="M 50,8 L 84,24 V 52 C 84,73 66,88 50,94 V 58 L 68,58 L 50,22 Z" fill="url(#tw-shield-right)" />
    <path d="M 50,22 L 64,52 H 36 L 50,22 Z" fill="url(#tw-neon-beam)" />
    <path d="M 50,33 L 57,48 H 43 L 50,33 Z" fill="#050814" />
    <rect x="28" y="55" width="44" height="4.5" rx="2.25" fill="#ffffff" />
    <path d="M 50,44 L 51.8,48.2 L 56,50 L 51.8,51.8 L 50,56 L 48.2,51.8 L 44,50 L 48.2,48.2 Z" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="380" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" letter-spacing="-2px">
    <tspan fill="#ffffff">ALPAR </tspan>
    <tspan fill="url(#tw-neon-beam)">AI</tspan>
  </text>

  <text x="385" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" letter-spacing="3px">
