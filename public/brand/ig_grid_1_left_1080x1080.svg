<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060f"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>

    <!-- Crimson Risk Glow (Left) -->
    <radialGradient id="riskGlow" cx="15%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Horizon Glow (Right) -->
    <radialGradient id="cyanTransitionGlow" cx="100%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#03060f" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="45" cy="45" r="1.2" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Red Alert Pattern -->
    <pattern id="diagRed" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- 1. BASE CANVASES -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  <rect width="1080" height="1080" fill="url(#riskGlow)"/>
  <rect width="1080" height="1080" fill="url(#cyanTransitionGlow)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect x="0" y="0" width="380" height="1080" fill="url(#diagRed)"/>

  <!-- CONTINUOUS PANORAMIC LASER LINES (MATCHES CENTER AND RIGHT GRIDS) -->
  <line x1="0" y1="90" x2="1080" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="0" y1="990" x2="1080" y2="990" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="0" y1="540" x2="1080" y2="540" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 8" stroke-opacity="0.22"/>

  <!-- TOP STATUS BAR -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e1014" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="14" cy="13" r="4.5" fill="#ef4444"/>
    <text x="28" y="17" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5">ALERT: LEVEL-4</text>
  </g>
  <g transform="translate(860, 64)">
    <text x="0" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PANEL 1 / 3</text>
  </g>

  <!-- CONTENT BODY -->
  <g transform="translate(80, 160)">
    <!-- Section Identifier -->
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3">01 // THE SYSTEM COLLAPSE</text>

    <!-- Main Headline -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      THE ERA OF
    </text>
    <text x="0" y="125" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      UNCHECKED AI
    </text>
    <text x="0" y="180" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      ENDS HERE.
    </text>

    <!-- Explanatory Subtext -->
    <text x="0" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      Every second, billion-parameter models hallucinate, leak
    </text>
    <text x="0" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      proprietary weights, and breach compliance boundaries.
    </text>

    <!-- Threat Vector Card 1 -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="460" height="74" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="37" r="12" fill="#ef4444" fill-opacity="0.15"/>
      <text x="28" y="42" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle">!</text>
      <text x="56" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">CATASTROPHIC HALLUCINATION</text>
      <text x="56" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Unverifiable decisions in finance, legal and defense stacks.</text>
    </g>

    <!-- Threat Vector Card 2 -->
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="460" height="74" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="37" r="12" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="28" y="42" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle">⚠️</text>
      <text x="56" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">EU AI ACT SANCTIONS</text>
      <text x="56" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Fines up to €35M or 7% of annual global turnover.</text>
    </g>

    <!-- Threat Vector Card 3 -->
    <g transform="translate(0, 490)">
      <rect x="0" y="0" width="460" height="74" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="37" r="12" fill="#a855f7" fill-opacity="0.15"/>
      <text x="28" y="42" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle">⚡</text>
      <text x="56" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">PROMPT INJECTION &amp; EXPLOITS</text>
      <text x="56" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Zero-day model extraction and jailbreak vulnerabilities.</text>
    </g>

    <!-- Bottom Panoramic Lead-In Arrow to Center Grid -->
    <g transform="translate(0, 610)">
      <text x="0" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE ANSWER ARISES →</text>
      <line x1="180" y1="20" x2="520" y2="20" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
      <polygon points="520,15 535,20 520,25" fill="#38bdf8"/>
    </g>
  </g>

  <!-- BOTTOM FOOTER -->
  <g transform="translate(80, 1030)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OFFICIAL OUTPOST: <tspan fill="#ffffff">@alparai</tspan> · SLIDE 1 OF 3</text>
  </g>
</svg>
