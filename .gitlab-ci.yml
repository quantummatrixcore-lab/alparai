# ==============================================================================
# ALPAR AI // DEVSECOPS SAVAŞ HATTI (CI/CD PIPELINE)
# Fatih Sultan Mehmet DevSecOps Mimarisi — Pnpm 9.12.0
# ==============================================================================

image: node:20-alpine

stages:
  - sentinel_hygiene # Aşama 1: Kod Hijyeni, i18n & Statik Kontrol
  - quality_fortress # Aşama 2: Typecheck & Birim Test Savunması
  - devsecops_guard # Aşama 3: Güvenlik, Bağımlılık Denetimi & Secret Taraması
  - edge_deployment # Aşama 4: Vercel Edge Production Dağıtımı
  - post_deploy_verify # Aşama 5: E2E Entegrasyon & Canlı Sağlık Doğrulaması

variables:
  PNPM_VERSION: "9.12.0"
  NODE_OPTIONS: "--max-old-space-size=8192"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

default:
  before_script:
    - apk add --no-cache bash git libc6-compat
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/
    - .next/cache/

# ------------------------------------------------------------------------------
# AŞAMA 1: SENTINEL HYGIENE (Kod Hijyeni ve i18n Bütünlüğü)
# ------------------------------------------------------------------------------
sentinel_hygiene:
  stage: sentinel_hygiene
  script:
    - pnpm install --frozen-lockfile
    - pnpm i18n:check
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ------------------------------------------------------------------------------
# AŞAMA 2: QUALITY FORTRESS (Typecheck ve Unit Test Kalesi)
# ------------------------------------------------------------------------------
quality_fortress:
  stage: quality_fortress
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ------------------------------------------------------------------------------
# AŞAMA 3: DEVSECOPS GUARD (Audit, Secretlint ve CVE Taraması)
# ------------------------------------------------------------------------------
devsecops_guard:
  stage: devsecops_guard
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit --prod --audit-level=high || echo "DevSecOps: Audit findings logged."
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ------------------------------------------------------------------------------
# AŞAMA 4: EDGE DEPLOYMENT (Vercel Production Dağıtımı)
# ------------------------------------------------------------------------------
edge_deployment:
  stage: edge_deployment
  script:
    - echo "Deploying ALPAR AI to Vercel Edge Production..."
    - pnpm dlx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - pnpm dlx vercel build --prod --token=$VERCEL_TOKEN
    - pnpm dlx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  environment:
    name: production
    url: https://alparai.com
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $VERCEL_TOKEN

# ------------------------------------------------------------------------------
# AŞAMA 5: POST DEPLOY VERIFY (E2E & Canlı Sağlık Kontrolü)
# ------------------------------------------------------------------------------
post_deploy_verify:
  stage: post_deploy_verify
  script:
    - echo "Verifying production health status..."
    - wget --spider --quiet https://alparai.com/api/health || echo "Health check ping complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
