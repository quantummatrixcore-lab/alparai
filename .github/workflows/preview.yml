name: Preview Deployment

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ops/visual-baseline/**"
      - ".vscode/**"

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  preview:
    name: PR Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY || 'test-key' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.PREVIEW_APP_URL || 'http://localhost:3000' }}

      - name: Bundle size check
        run: |
          echo "Bundle size analysis..."
          if [ -d .next/static ]; then
            du -sh .next/static/chunks 2>/dev/null || true
            du -sh .next/static/css 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI pipeline passed! Preview deployment is ready.'
            });
