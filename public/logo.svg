<svg viewBox="0 0 340 90" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Text Gradients -->
    <linearGradient id="alpar-brand-text-alpar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="alpar-brand-text-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Shield Left Facet -->
    <linearGradient id="alpar-svg-wing-left" x1="15" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Shield Right Facet -->
    <linearGradient id="alpar-svg-wing-right" x1="85" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Monogram 'A' Core Apex -->
    <linearGradient id="alpar-svg-core-beam" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Starburst Core -->
    <linearGradient id="alpar-svg-spark" x1="45" y1="45" x2="55" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="alpar-svg-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 8) scale(0.8)">
    <path d="M 50,8 L 16,24 V 52 C 16,73 34,88 50,94 V 58 L 32,58 L 50,22 Z" fill="url(#alpar-svg-wing-left)" fill-opacity="0.95" />
    <path d="M 50,8 L 84,24 V 52 C 84,73 66,88 50,94 V 58 L 68,58 L 50,22 Z" fill="url(#alpar-svg-wing-right)" fill-opacity="0.9" />
    <path d="M 50,22 L 64,52 H 36 L 50,22 Z" fill="url(#alpar-svg-core-beam)" fill-opacity="0.85" filter="url(#alpar-svg-bloom)" />
    <path d="M 50,33 L 57,48 H 43 L 50,33 Z" fill="#0b0f19" />
    <rect x="28" y="55" width="44" height="4.5" rx="2.25" fill="#ffffff" fill-opacity="0.95" filter="url(#alpar-svg-bloom)" />
    <path d="M 50,44 L 51.8,48.2 L 56,50 L 51.8,51.8 L 50,56 L 48.2,51.8 L 44,50 L 48.2,48.2 Z" fill="url(#alpar-svg-spark)" filter="url(#alpar-svg-bloom)" />
  </g>

  <!-- Typography: ALPAR AI -->
  <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5px">
    <tspan fill="url(#alpar-brand-text-alpar)">ALPAR </tspan>
    <tspan fill="url(#alpar-brand-text-ai)">AI</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="98" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="2.2px">
    INDEPENDENT AI INCIDENT REGISTRY
  </text>
</svg>