name: "💡 Feature Request"
description: "Suggest an idea or enhancement for the ALPAR AI platform."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We build what matters to the AI safety and accountability community. Thank you for your suggestion!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: "Is your feature request related to a problem? Please describe."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: "Describe the solution you'd like to see."
      placeholder: "Add an export button for incident audit logs in JSON format..."
    validations:
      required: true
