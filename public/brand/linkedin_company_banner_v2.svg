<svg viewBox="0 0 1128 191" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="v2-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="40%" stop-color="#0a1024" />
      <stop offset="80%" stop-color="#0d1430" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Beam -->
    <linearGradient id="v2-neon-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Hologram Shield Left -->
    <linearGradient id="v2-shield-left" x1="15" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Hologram Shield Right -->
    <linearGradient id="v2-shield-right" x1="85" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="v2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1128" height="191" fill="url(#v2-bg-grad)" />

  <!-- Subtle Perspective Grid (Cyber Architecture) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="48" x2="1128" y2="48" />
    <line x1="0" y1="96" x2="1128" y2="96" />
    <line x1="0" y1="144" x2="1128" y2="144" />
    <line x1="260" y1="0" x2="260" y2="191" />
    <line x1="480" y1="0" x2="480" y2="191" />
    <line x1="700" y1="0" x2="700" y2="191" />
    <line x1="920" y1="0" x2="920" y2="191" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="560" cy="80" r="160" fill="#a855f7" fill-opacity="0.12" filter="url(#v2-glow)" />
  <circle cx="980" cy="95" r="140" fill="#38bdf8" fill-opacity="0.10" filter="url(#v2-glow)" />

  <!-- LEFT ZONE (x: 0 to 260) IS INTENTIONALLY CLEAN FOR THE LINKEDIN PROFILE AVATAR OVERLAY -->

  <!-- CENTER-LEFT BRANDING (Starts at x=280 to prevent ANY collision with Avatar) -->
  <g transform="translate(280, 0)">
    <!-- Brand Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-1px">
      <tspan fill="#ffffff">ALPAR </tspan>
      <tspan fill="url(#v2-neon-beam)">AI</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="1.8px">
      THE TRUST &amp; ACCOUNTABILITY INFRASTRUCTURE FOR GLOBAL AI
    </text>

    <!-- Badges Row -->
    <g transform="translate(2, 126)">
      <!-- Badge 1: 2,880+ Indexed Incidents -->
      <rect x="0" y="0" width="180" height="30" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="14" y="20" font-family="sans-serif" font-size="12" font-weight="800" fill="#c084fc">🛡️ 2,880+ INCIDENTS</text>

      <!-- Badge 2: EU AI Act Standard -->
      <rect x="194" y="0" width="200" height="30" rx="8" fill="#082f49" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="208" y="20" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">⚖️ EU AI ACT COMPLIANT</text>

      <!-- Badge 3: Sovereign Rating -->
      <rect x="408" y="0" width="165" height="30" rx="8" fill="#141c38" fill-opacity="0.85" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="420" y="20" font-family="sans-serif" font-size="12" font-weight="800" fill="#e2e8f0">🌐 SOVEREIGN RATING</text>
    </g>
  </g>

  <!-- FAR RIGHT: Holographic Cyber Sentinel Amblem (Scale: 1.4, Floating Elegantly on Right) -->
  <g transform="translate(970, 30) scale(1.4)" filter="url(#v2-glow)">
    <path d="M 50,8 L 16,24 V 52 C 16,73 34,88 50,94 V 58 L 32,58 L 50,22 Z" fill="url(#v2-shield-left)" opacity="0.85" />
    <path d="M 50,8 L 84,24 V 52 C 84,73 66,88 50,94 V 58 L 68,58 L 50,22 Z" fill="url(#v2-shield-right)" opacity="0.85" />
    <path d="M 50,22 L 64,52 H 36 L 50,22 Z" fill="url(#v2-neon-beam)" />
    <path d="M 50,33 L 57,48 H 43 L 50,33 Z" fill="#0a1024" />
    <rect x="28" y="55" width="44" height="4.5" rx="2.25" fill="#ffffff" />
    <path d="M 50,44 L 51.8,48.2 L 56,50 L 51.8,51.8 L 50,56 L 48.2,51.8 L 44,50 L 48.2,48.2 Z" fill="#ffffff" />
  </g>

  <!-- URL Bottom Right -->
  <text x="1100" y="174" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5px">
    WWW.ALPARAI.COM
  </text>
</svg>
