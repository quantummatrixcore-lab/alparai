name: Nightly Health Check
on:
  schedule:
    - cron: "0 2 * * *" # Her gece 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Test Suite
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: MASTER_PLAN Length Check
        run: node scripts/check-master-plan-length.mjs
      - name: MasterPlan Consistency
        run: node scripts/check-masterplan-consistency.mjs
      - name: Open Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[NIGHTLY] Health check failed ' + new Date().toISOString().slice(0,10),
              labels: ['health-check', 'automated'],
              body: 'Nightly health check failed. Check run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
