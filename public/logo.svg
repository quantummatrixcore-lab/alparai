<svg viewBox="0 0 340 90" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Titanium Silver Chiseled Left Facet -->
    <linearGradient id="alpar-facet-titanium" x1="20" y1="10" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Electric Cobalt Prismatic Right Facet -->
    <linearGradient id="alpar-facet-cobalt" x1="50" y1="10" x2="85" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Inner Refraction Core / Crossbeam -->
    <linearGradient id="alpar-facet-cyan-beam" x1="30" y1="50" x2="70" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Wordmark Gradients -->
    <linearGradient id="alpar-text-pure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    
    <linearGradient id="alpar-text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Iconic Monolithic Prismatic 'A' Emblem -->
  <g transform="translate(8, 7) scale(0.82)">
    <!-- Ambient Shadow Base -->
    <polygon points="50,8 14,88 86,88" fill="#030712" fill-opacity="0.4" />
    
    <!-- Left Titanium Pillar -->
    <polygon points="50,8 16,88 34,88 50,46" fill="url(#alpar-facet-titanium)" />
    
    <!-- Right Cobalt Prismatic Pillar -->
    <polygon points="50,8 50,46 66,88 84,88" fill="url(#alpar-facet-cobalt)" />
    
    <!-- Inner Crossbar Optical Prism -->
    <polygon points="32,70 68,70 50,42" fill="url(#alpar-facet-cyan-beam)" />
    <polygon points="34,70 66,70 50,84" fill="#0b1329" fill-opacity="0.95" />
    
    <!-- Precision Center Light Point -->
    <circle cx="50" cy="45" r="2" fill="#ffffff" fill-opacity="0.9" />
  </g>

  <!-- Typography: ALPAR AI -->
  <text x="96" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5px">
    <tspan fill="url(#alpar-text-pure)">ALPAR </tspan>
    <tspan fill="url(#alpar-text-accent)">AI</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="98" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="2.8px">
    THE SUPREME COURT OF AI ACCOUNTABILITY
  </text>
</svg>