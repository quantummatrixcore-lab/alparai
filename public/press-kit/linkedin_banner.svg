<svg viewBox="0 0 1128 191" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Beam -->
    <linearGradient id="neon-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Shield Gradient Left -->
    <linearGradient id="li-shield-left" x1="15" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Shield Gradient Right -->
    <linearGradient id="li-shield-right" x1="85" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Glow -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1128" height="191" fill="url(#bg-grad)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1128" y2="40" />
    <line x1="0" y1="80" x2="1128" y2="80" />
    <line x1="0" y1="120" x2="1128" y2="120" />
    <line x1="0" y1="160" x2="1128" y2="160" />
    <line x1="150" y1="0" x2="150" y2="191" />
    <line x1="300" y1="0" x2="300" y2="191" />
    <line x1="450" y1="0" x2="450" y2="191" />
    <line x1="600" y1="0" x2="600" y2="191" />
    <line x1="750" y1="0" x2="750" y2="191" />
    <line x1="900" y1="0" x2="900" y2="191" />
    <line x1="1050" y1="0" x2="1050" y2="191" />
  </g>

  <!-- Neon Ambient Glow Spheres -->
  <circle cx="200" cy="95" r="140" fill="#a855f7" fill-opacity="0.12" filter="url(#text-glow)" />
  <circle cx="950" cy="95" r="130" fill="#38bdf8" fill-opacity="0.10" filter="url(#text-glow)" />

  <!-- Cyber Sentinel Shield Icon (Left Side) -->
  <g transform="translate(60, 35) scale(1.2)">
    <path d="M 50,8 L 16,24 V 52 C 16,73 34,88 50,94 V 58 L 32,58 L 50,22 Z" fill="url(#li-shield-left)" />
    <path d="M 50,8 L 84,24 V 52 C 84,73 66,88 50,94 V 58 L 68,58 L 50,22 Z" fill="url(#li-shield-right)" />
    <path d="M 50,22 L 64,52 H 36 L 50,22 Z" fill="url(#neon-beam)" />
    <path d="M 50,33 L 57,48 H 43 L 50,33 Z" fill="#060913" />
    <rect x="28" y="55" width="44" height="4.5" rx="2.25" fill="#ffffff" />
    <path d="M 50,44 L 51.8,48.2 L 56,50 L 51.8,51.8 L 50,56 L 48.2,51.8 L 44,50 L 48.2,48.2 Z" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <text x="210" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1px">
    <tspan fill="#ffffff">ALPAR </tspan>
    <tspan fill="url(#neon-beam)">AI</tspan>
  </text>

  <text x="212" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="1.5px">
    THE TRUST &amp; ACCOUNTABILITY INFRASTRUCTURE FOR GLOBAL AI
  </text>

  <!-- Key Badges on Right -->
  <g transform="translate(730, 60)">
    <!-- Badge 1: 2.880+ Incidents -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5" />
    <text x="14" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#c084fc">🛡️ 2,880+ INCIDENTS</text>

    <!-- Badge 2: EU AI Act -->
    <rect x="180" y="0" width="185" height="34" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-opacity="0.5" />
    <text x="194" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">⚖️ EU AI ACT COMPLIANT</text>
  </g>

  <!-- Web URL Tag -->
  <text x="1060" y="165" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1px">
    WWW.ALPARAI.COM
  </text>
</svg>
