<svg viewBox="0 0 2400 800" width="2400" height="800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="u-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050e"/>
      <stop offset="35%" stop-color="#060e1d"/>
      <stop offset="70%" stop-color="#0a172e"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>

    <radialGradient id="u-cyan-glow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Emblem Gradients -->
    <linearGradient id="u-shield-fill" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0b1329" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="u-shield-stroke" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Horizontal Telemetry Beam Gradient -->
    <linearGradient id="u-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Pill Badge Gradients -->
    <linearGradient id="u-badge-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- MASTER CANVAS BACKGROUND -->
  <rect width="2400" height="800" fill="url(#u-bg-grad)"/>
  <rect width="2400" height="800" fill="url(#u-cyan-glow)"/>

  <!-- AMBIENT CYBERNETIC GRID (Sparse & Enterprise) -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1.2">
    <!-- Horizontal lines -->
    <line x1="0" y1="160" x2="2400" y2="160"/>
    <line x1="0" y1="320" x2="2400" y2="320"/>
    <line x1="0" y1="480" x2="2400" y2="480"/>
    <line x1="0" y1="640" x2="2400" y2="640"/>
    <!-- Vertical lines -->
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="1500" y1="0" x2="1500" y2="800"/>
    <line x1="1800" y1="0" x2="1800" y2="800"/>
    <line x1="2100" y1="0" x2="2100" y2="800"/>
  </g>

  <!-- LEFT 25% ZONE: AVATAR CLEARANCE AREA (0px - 600px) -->
  <!-- Contains only faint technical coordinates and circuit traces so overlapping avatars don't occlude branding -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 120, 200 L 220, 200 L 260, 240" fill="none"/>
    <circle cx="260" cy="240" r="3" fill="#38bdf8"/>
    <path d="M 80, 600 L 180, 600 L 230, 550" fill="none"/>
    <circle cx="230" cy="550" r="3" fill="#38bdf8"/>
  </g>

  <!-- =============================================================== -->
  <!-- GOLDEN BRAND SAFE ZONE (x: 650 to 2200, y: 150 to 650)          -->
  <!-- =============================================================== -->

  <!-- MASTER EMBLEM (Centered at x: 780, y: 400, scaled 4.6x) -->
  <g transform="translate(780, 400) scale(4.6) translate(-50, -50)">
    
  <!-- SHIELD CONTOUR -->
  <path d="M 50, 8 L 16, 23 C 16, 60 32, 82 50, 92 C 68, 82 84, 60 84, 23 Z" 
        fill="url(#u-shield-fill)" 
        stroke="url(#u-shield-stroke)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Inner Bevel Accent -->
  <path d="M 50, 14 L 21, 27 C 21, 56 34, 75 50, 84" 
        stroke="#ffffff" 
        stroke-opacity="0.14" 
        stroke-width="1.2" 
        stroke-linecap="round"/>

  <!-- CENTRAL PILLAR -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="18" r="2.5" fill="#ffffff"/>
  <polygon points="44,82 56,82 50,77" fill="#cbd5e1"/>

  <!-- LEFT: SCALES OF JUSTICE -->
  <path d="M 50, 32 L 28, 32" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="28" cy="32" r="1.5" fill="#ffffff"/>
  <line x1="28" y1="32" x2="21" y2="45" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="32" x2="35" y2="45" stroke="#94a3b8" strokeWidth="1.2" stroke-linecap="round"/>
  <path d="M 19, 45 C 19, 55 37, 55 37, 45 Z" fill="#ffffff" fill-opacity="0.95" stroke="#ffffff" stroke-width="0.8"/>

  <!-- RIGHT: NEURAL CIRCUITS -->
  <path d="M 50, 32 L 62, 32 L 68, 26" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="68" cy="26" r="2.5" fill="#00f2fe"/>

  <path d="M 50, 48 L 59, 48 L 65, 43 L 73, 43" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="73" cy="43" r="2.5" fill="#38bdf8"/>

  <path d="M 50, 64 L 58, 64 L 66, 72" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="66" cy="72" r="2.5" fill="#0284c7"/>
  
  </g>

  <!-- TYPOGRAPHY & MANIFESTO CLUSTER (starts at x: 1040) -->
  <g transform="translate(1040, 220)">
    <!-- Primary Logotype: ALPAR AI -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="900" letter-spacing="4px">
      <tspan fill="#ffffff">ALPAR </tspan>
      <tspan fill="#00f2fe">AI</tspan>
    </text>

    <!-- Subtitle: THE TRUST INFRASTRUCTURE FOR AI ACCOUNTABILITY -->
    <text x="4" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#38bdf8" letter-spacing="5px">
      THE TRUST INFRASTRUCTURE FOR AI ACCOUNTABILITY
    </text>

    <!-- Telemetry Separator Line -->
    <rect x="4" y="175" width="1120" height="2" fill="url(#u-beam-grad)"/>

    <!-- 4 Regulatory Compliance Badges -->
    <g transform="translate(4, 205)">
      <!-- Badge 1: EU AI Act -->
      <g transform="translate(0, 0)">
        <rect width="250" height="38" rx="8" fill="url(#u-badge-bg)" stroke="#1e293b" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4" fill="#10b981"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1px">
          EU AI ACT COMPLIANT
        </text>
      </g>

      <!-- Badge 2: Independent Forensic Cross-Audit -->
      <g transform="translate(265, 0)">
        <rect width="270" height="38" rx="8" fill="url(#u-badge-bg)" stroke="#1e293b" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4" fill="#38bdf8"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1px">
          INDEPENDENT CROSS-AUDIT
        </text>
      </g>

      <!-- Badge 3: PII Guardian Shield -->
      <g transform="translate(550, 0)">
        <rect width="230" height="38" rx="8" fill="url(#u-badge-bg)" stroke="#1e293b" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4" fill="#00f2fe"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1px">
          PII GUARDIAN SHIELD
        </text>
      </g>

      <!-- Badge 4: ISO/IEC 42001 Ready -->
      <g transform="translate(795, 0)">
        <rect width="220" height="38" rx="8" fill="url(#u-badge-bg)" stroke="#1e293b" stroke-width="1.2"/>
        <circle cx="20" cy="19" r="4" fill="#a855f7"/>
        <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1px">
          ISO/IEC 42001 READY
        </text>
      </g>
    </g>

    <!-- Secondary Forensic Capabilities Descriptor -->
    <text x="6" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="2.5px">
      Autonomous Verification • Algorithmic Forensics • Zero-Knowledge Model Governance • alparai.com
    </text>
  </g>
</svg>